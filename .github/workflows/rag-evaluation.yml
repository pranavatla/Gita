name: RAG Evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rag-evaluation.yml"
      - "eval/rag_eval_cases.json"
      - "scripts/evaluate_rag.py"
      - "scripts/answer.py"
      - "scripts/rerank.py"
      - "scripts/local_vector_search.py"
      - "scripts/bedrock_client.py"
      - "data/vector_cache/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  evaluate-rag:
    name: Run RAG regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Smoke evaluation - first 5 cases
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/evaluate_rag.py --limit 5

      - name: Full evaluation - 25 cases
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/evaluate_rag.py
