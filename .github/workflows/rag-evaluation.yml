name: RAG Evaluation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build and Push to ECR
    types:
      - completed

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  evaluate-rag:
    name: Run RAG regression in deployed container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}

    steps:
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Build kubeconfig for cluster
        run: |
          aws eks update-kubeconfig \
            --region "${{ env.AWS_REGION }}" \
            --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Wait for current deployment rollout
        run: |
          kubectl rollout status deployment/${{ vars.K8S_DEPLOYMENT }} \
            -n "${{ vars.K8S_NAMESPACE }}" \
            --timeout=10m

      - name: Smoke evaluation - first 5 cases
        run: |
          kubectl exec deployment/${{ vars.K8S_DEPLOYMENT }} \
            -n "${{ vars.K8S_NAMESPACE }}" \
            -c "${{ vars.K8S_CONTAINER }}" \
            -- sh -lc 'cd /app && PYTHONPATH=scripts python scripts/evaluate_rag.py --limit 5'

      - name: Full evaluation - 25 cases
        run: |
          kubectl exec deployment/${{ vars.K8S_DEPLOYMENT }} \
            -n "${{ vars.K8S_NAMESPACE }}" \
            -c "${{ vars.K8S_CONTAINER }}" \
            -- sh -lc 'cd /app && PYTHONPATH=scripts python scripts/evaluate_rag.py'
